[package]
name = "cassis-demo-stores"
version = "0.1.0"
edition = "2021"

[features]
default = ["cashu"]
arkade = ["cassis-wallet/arkade"]
bark-lightning = ["cassis-wallet/bark-lightning"]
bitcoin = ["cassis-wallet/bitcoin"]
cashu = ["cassis-wallet/cashu"]
fedimint = ["cassis-wallet/fedimint"]
lightning = ["cassis-wallet/lightning"]
liquid = ["cassis-wallet/liquid"]
rootstock = ["cassis-wallet/rootstock"]

[dependencies]
async-trait = "0.1.91"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
cassis-core = { git = "https://github.com/andunieee/cassis", tag = "v0.3.0", default-features = false, features = ["node"] }
cassis-wallet = { git = "https://github.com/andunieee/cassis", tag = "v0.3.0", default-features = false }
clap = { version = "4.6.6", features = ["derive", "env"] }
base64 = "0.22.1"
hypereffect = "0.6.3"
iroh = "1.0.3"
png = "0.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tracing = "0.1.44"

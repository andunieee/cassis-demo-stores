[package]
name = "cassis-demo-stores"
version = "0.1.1"
edition = "2021"

[features]
default = []
arkade = ["cassis-wallet/arkade", "hyperb-cassis-wallet/arkade"]
bark-lightning = ["cassis-wallet/bark-lightning", "hyperb-cassis-wallet/bark-lightning"]
bitcoin = ["cassis-wallet/bitcoin", "hyperb-cassis-wallet/bitcoin"]
cashu = ["cassis-wallet/cashu", "hyperb-cassis-wallet/cashu"]
fedimint = ["cassis-wallet/fedimint", "hyperb-cassis-wallet/fedimint"]
lightning = ["cassis-wallet/lightning", "hyperb-cassis-wallet/lightning"]
liquid = ["cassis-wallet/liquid", "hyperb-cassis-wallet/liquid"]
rootstock = ["cassis-wallet/rootstock", "hyperb-cassis-wallet/rootstock"]
# `bitcoin` pulls `esplora-client`, whose default transport uses native-tls.
# For a fully static musl build, compile OpenSSL from source instead of
# linking the host's shared libssl.
vendored-openssl = ["dep:openssl-sys"]

[dependencies]
async-trait = "0.1.91"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
cassis-core = { git = "https://github.com/andunieee/cassis", rev = "5a04b43034a4335311afc3954ef9ea4c1bdeca08", default-features = false, features = ["node"] }
cassis-wallet = { git = "https://github.com/andunieee/cassis", rev = "5a04b43034a4335311afc3954ef9ea4c1bdeca08", default-features = false }
clap = { version = "4.6.6", features = ["derive", "env"] }
base64 = "0.22.1"
hyperb-cassis-wallet = { git = "https://github.com/andunieee/cassis", rev = "5a04b43034a4335311afc3954ef9ea4c1bdeca08" }
hypereffect = "0.7.0"
# `hyperb-cassis-wallet` is still on hypereffect 0.6.
hypereffect_06 = { package = "hypereffect", version = "0.6.3" }
iroh = "1.0.3"
openssl-sys = { version = "0.9.118", features = ["vendored"], optional = true }
png = "0.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tracing = "0.1.44"
